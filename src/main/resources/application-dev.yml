server:
  port: 8381 #
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tab_notifications_dev
    username: myuser
    password: secret
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  config:
    activate:
      on-profile: dev
  mail:
    host: ${EMAIL_HOST}
    port: ${EMAIL_PORT}
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

google-firebase:
  api-base-url: https://identitytoolkit.googleapis.com/v1/accounts

logging:
  level:
    root: DEBUG